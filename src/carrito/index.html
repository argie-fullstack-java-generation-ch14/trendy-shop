<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trendy Shop - Carrito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="carrito.css">
</head>
<body>
  <header id="header"></header>

  <main class="carrito-page">
  <div class="container mt-5">
    <h2>Carrito</h2>

    <!-- laista de productos estala llena carrito   -->
    <section id="carrito-lista" class="my-4"></section>
    <!-- cupones   -->
    <form id="form-cupon" class="carrito__cupon d-flex gap-2 mb-2">
      <input type="text" id="input-cupon" class="form-control" placeholder="código de cupón">
      <button type="submit" class="btn btn-dark">Aplicar</button>
    </form>
    <p id="mensaje-cupon" class="mb-4"></p>
    <section class="carrito__resumen">
      <p>Subtotal: <span id="resumen-subtotal"></span></p>
      <p>Descuento: <span id="resumen-descuento"></span></p>
      <p>Total: <strong id="resumen-total"></strong></p>
      <button id="btn-vaciar" class="btn btn-outline-danger">Vaciar carrito</button>
    </section>
  </div>
</main>

  <footer id="footer" class="py-4 mt-5"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/app.js"></script>
  <script type="module" src="carrito.js"></script>
  <script type="module" src="../js/contador.js"></script>
</body>
</html>
