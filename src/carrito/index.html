<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trendy Shop - Carrito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="carrito.css">
</head>
<body>
  <header id="header"></header>
 
  <main class="carrito-page">
    <div class="container mt-5">
      <h2>Tu carrito</h2>
 
      <div class="carrito__layout">
        <!-- lista de productos: la llena carrito.js -->
        <section id="carrito-lista"></section>
 
        <!-- resumen del pedido -->
        <aside class="carrito__panel">
          <h3>Resumen del pedido</h3>
 
          <section class="carrito__resumen">
            <p>Subtotal: <span id="resumen-subtotal"></span></p>
            <p>Descuento: <span id="resumen-descuento"></span></p>
            <p>Total: <strong id="resumen-total"></strong></p>
          </section>
 
          <!-- cupón -->
          <form id="form-cupon" class="carrito__cupon d-flex gap-2">
            <input type="text" id="input-cupon" class="form-control" placeholder="código de cupón">
            <button type="submit" class="btn btn-dark">Aplicar</button>
          </form>
          <p id="mensaje-cupon"></p>
 
          <button id="btn-pagar" type="button" class="btn btn-dark">Ir a pagar</button>
          <button id="btn-vaciar" type="button" class="btn">Vaciar carrito</button>
        </aside>
      </div>
    </div>
  </main>
 
  <footer id="footer" class="py-4 mt-5"></footer>
 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/app.js"></script>
  <script type="module" src="carrito.js"></script>
  <script type="module" src="../js/contador.js"></script>
</body>
</html>
