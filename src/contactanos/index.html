<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trendy Shop - Contáctanos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="contactanos.css">
</head>
<body>
  <body>
  <header id="header"></header>

  <main>
    <h1>Trendy Shop</h1>
  </main>
<section>

  <div class="card">
  </div>

<div class="card mt-4 mx-auto text-start" style="max-width: 500px;">
    <div class="card-body">
        <h5 class="card-title">Contactanos</h5>
        <p class="card-text">Estamos aqui para ayudarte, si tienes alguna duda, sugerencia o necesitas asistencia, escribenos.</p>
        <p class="card-text">Sera un gusto atenderte!</p>
    </div>
</div>
</div>
    <div class="contacto-container">
        <img src="..." class="img-contacto" alt="Contacto">

        <h2>Envianos un mensaje</h2>
        
        <form id="contact-form">
            <div class="form-group">
                <label for="name">Nombre:</label>
                <input type="text" id="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" required>
            </div>
            
            <div class="form-group">
                <label for="message">Mensaje:</label>
                <textarea id="message" rows="4" required></textarea>
            </div>
            
            <button type="submit">Enviar Mensaje</button>
        </form>

        <div id="form-message" style="margin-top: 15px; text-align: center;"></div>
    </div>
</section>
  <footer id="footer" class="py-4 mt-5"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/app.js"></script>
  <script src="contactanos.js"></script>
</body>
</html>
